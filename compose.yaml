# Deployment file (server-spec 3.2). No database service: the target server already runs Postgres.
#
#   docker compose up -d                                       # target server
#   docker compose -f compose.yaml -f compose.local.yaml up    # local development
#
# Secrets come from a .env file next to this one, which is never committed. See .env.example.
services:
  sudoku:
    image: sudoku-server:latest
    restart: unless-stopped
    environment:
      SUDOKU_DB_URL: "${SUDOKU_DB_URL}"
      SUDOKU_DB_USER: "${SUDOKU_DB_USER}"
      SUDOKU_DB_PASSWORD: "${SUDOKU_DB_PASSWORD}"
      SUDOKU_BOOTSTRAP_INVITE: "${BOOTSTRAP_INVITE}"
      SUDOKU_TIMEZONE: "Europe/Berlin"
      SUDOKU_DAILY_SIZE: "9"
    ports:
      # Bound to loopback, not 0.0.0.0. The app speaks plain HTTP and nginx terminates TLS in front of
      # it, so it must never be directly reachable - SUDOKU_TRUST_PROXY makes it believe the
      # X-Real-IP / X-Forwarded-For headers, which is only safe while this stays on loopback.
      - "127.0.0.1:7000:7000"
    extra_hosts:
      # Lets the container reach a Postgres running on the host on Linux, so SUDOKU_DB_URL can be
      # jdbc:postgresql://host.docker.internal:5432/sudoku. If Postgres instead lives in another
      # Compose stack, drop this and attach that stack's external network.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:7000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
