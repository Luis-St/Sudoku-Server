name: Build and push the docker image on tag

on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    environment: Default
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5.0.0
      - name: 'Determine version'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: 'Set up JDK 25'
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: 'Grant Permission to Gradle'
        run: chmod +x gradlew
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4.4.3
      - name: 'Build the jar with Gradle'
        run: ./gradlew shadowJar
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Log in to artifact.luis-st.net'
        uses: docker/login-action@v3
        with:
          registry: artifact.luis-st.net
          username: __token__
          password: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: 'Build and push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: artifact.luis-st.net/vps/sudoku-server:${{ env.VERSION }}
